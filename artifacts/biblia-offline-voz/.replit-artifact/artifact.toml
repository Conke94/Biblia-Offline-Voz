kind = "mobile"
previewPath = "/"
title = "Bíblia Offline Voz"
description = "Aplicativo Android offline para ouvir capítulos da Bíblia e aulas cristãs por síntese de voz, com evolução planejada para transcrição de fala e troca de mensagens por Bluetooth."
version = "1.0.0"
id = "artifacts/biblia-offline-voz"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20455

[services.development]
run = "pnpm --filter @workspace/biblia-offline-voz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biblia-offline-voz", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/biblia-offline-voz", "run", "serve" ]

[services.env]
PORT = "20455"
BASE_PATH = "/"
